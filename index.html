<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<meta name="description" content="식물환자 — 작물이 내는 초음파로 스트레스를 조기에 감지하는 스마트팜 조기경보 서비스">
<title>식물환자 — 작물 초음파 조기경보</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

:root{
  --blue:#2a78d6; --blue-d:#1c5cab; --blue-100:#cde2fb; --blue-150:#b7d3f6;
  --good:#0ca30c; --warning:#fab219; --warning-t:#a06b00; --serious:#ec835a; --critical:#d03b3b;
  --surface:#fcfcfb; --card:#ffffff; --text:#0b0b0b; --text2:#52514e; --muted:#8a8985;
  --grid:#e5e4e0; --page:#eceae5;
  --phone:430px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

html,body{height:100%}
body{
  font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  background:var(--page); color:var(--text);
  font-size:15px; line-height:1.5;
  display:flex; justify-content:center;
}
button,input,select{font-family:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}

/* ===== 앱 셸 ===== */
.app{
  width:100%; max-width:var(--phone); min-height:100dvh; height:100dvh;
  background:var(--surface); display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  border-left:1px solid var(--grid); border-right:1px solid var(--grid);
}
@media (min-width:640px){
  body{padding:24px 0}
  .app{height:calc(100dvh - 48px); min-height:640px; border-radius:22px;
       border:1px solid var(--grid); box-shadow:0 14px 40px rgba(0,0,0,.13); overflow:hidden}
}

/* ===== 앱바 ===== */
.appbar{
  padding:14px 18px 13px; border-bottom:1px solid var(--grid);
  background:var(--card); flex:0 0 auto; z-index:5;
  padding-top:max(14px, env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:28px;height:28px;border-radius:9px;background:var(--blue);position:relative;flex:0 0 auto}
.logo::before{content:"";position:absolute;left:6.5px;top:13px;width:15px;height:2.5px;background:#fff;border-radius:2px}
.logo::after{content:"";position:absolute;left:12.75px;top:6.5px;width:2.5px;height:15px;background:#fff;border-radius:2px}
.brand h1{font-size:17.5px;font-weight:800;letter-spacing:-.4px}
.brand .en{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.appbar .loc{font-size:12px;color:var(--text2);margin-top:6px;padding-left:37px}
.appbar .back{
  display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
  color:var(--blue);min-height:30px;margin:-4px 0 2px -6px;padding:0 6px;border-radius:8px
}

/* ===== 본문 ===== */
.screens{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen{padding:16px 16px 26px;animation:fade .22s ease}
.screen[hidden]{display:none}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.sec{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin:20px 0 9px}
.sec:first-child{margin-top:2px}

/* ===== 오늘 할 일 (첫 화면 맨 위) ===== */
.todo{
  border-radius:16px;padding:15px 14px;margin-bottom:15px;
  border:1.5px solid var(--critical);background:#fdf6f6
}
.todo.s-warn{border-color:#e7cd93;background:#fdfaf2}
.todo.ok{border-color:var(--good);background:#f4faf4}
.tdl{font-size:12.5px;font-weight:800;letter-spacing:.4px;color:var(--critical)}
.todo.s-warn .tdl{color:var(--warning-t)}
.todo.ok .tdl{color:var(--good)}
.tdv{font-size:19px;font-weight:800;margin-top:8px;line-height:1.4;letter-spacing:-.4px}
.tdp{font-size:14.5px;color:var(--text2);margin-top:9px;line-height:1.55}
.tdp b{color:var(--text);font-weight:700}
.todo .btn{margin-top:13px}
.todo .rowbtns .btn{margin-top:0}
.doneflag{color:var(--blue-d);font-weight:800}

/* ===== 예시 데이터 고지 ===== */
.demoflag-bar{
  background:#fdfaf2;border:1.5px solid #e7cd93;border-radius:12px;padding:11px 12px;
  margin-bottom:14px;font-size:13px;color:var(--warning-t);font-weight:700;line-height:1.6
}
.demoflag-bar b{font-weight:800}
.demoflag-line{
  background:#fdfaf2;border:1px solid #e7cd93;border-radius:10px;padding:8px 11px;
  margin-bottom:10px;font-size:12.5px;color:var(--warning-t);font-weight:700
}
.app.big .demoflag-bar{font-size:15.5px}
.app.big .demoflag-line{font-size:14.5px}

/* ===== 한계 고지 ===== */
.limits{background:var(--card);border:1px solid var(--grid);border-radius:14px;padding:13px}
.limits .ltitle{font-size:14.5px;font-weight:800;margin-bottom:10px}
.limits ul{list-style:none}
.limits li{
  font-size:13px;color:var(--text2);line-height:1.65;padding-left:16px;position:relative;margin-bottom:10px
}
.limits li:last-child{margin-bottom:0}
.limits li::before{
  content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--warning-t)
}
.limits li b{color:var(--text);font-weight:700}
.app.big .limits .ltitle{font-size:17px}
.app.big .limits li{font-size:15.5px}
.donecard{
  background:#eef5fd;border:1.5px solid var(--blue);border-radius:14px;padding:13px;margin-top:9px
}
.donecard .dl{color:var(--blue-d)}
.donecard .dv{font-size:16.5px;color:var(--blue-d)}
.donecard .dp{color:var(--blue-d);opacity:.85}
.app.big .donecard .dv{font-size:19.5px}

/* ===== 상태 요약 타일 ===== */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:var(--card);border:1px solid var(--grid);border-radius:13px;padding:13px 8px;text-align:center}
.tile .n{font-size:29px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--text2);margin-top:5px;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}

/* ===== 배지 ===== */
.badge{
  font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff;
  letter-spacing:.2px;flex:0 0 auto;line-height:1.35
}
.b-good{background:var(--good)} .b-warn{background:var(--warning-t)} .b-crit{background:var(--critical)}

/* ===== 베드 카드 ===== */
.bed{
  width:100%;text-align:left;background:var(--card);border:1px solid var(--grid);border-radius:14px;
  padding:13px;margin-bottom:9px;display:flex;align-items:center;gap:12px;min-height:68px;
  transition:border-color .5s ease, background-color .5s ease, box-shadow .18s ease
}
.bed:active{box-shadow:0 0 0 3px var(--blue-100)}
.bed.s-crit{border-color:var(--critical);border-width:1.5px;background:#fdf6f6;padding:12.5px}
.bed.s-warn{border-color:#e7cd93;background:#fdfaf2}
.bedno{
  width:44px;height:44px;border-radius:12px;background:var(--blue-100);color:var(--blue-d);
  font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:background-color .5s ease,color .5s ease;font-variant-numeric:tabular-nums
}
.bed.s-crit .bedno{background:#f8dede;color:var(--critical)}
.bed.s-warn .bedno{background:#f6e9cc;color:var(--warning-t)}
.bedinfo{flex:1;min-width:0}
.bedinfo .t{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
.bedinfo .s{font-size:13.5px;color:var(--text2);margin-top:5px}
.bedinfo .s b{color:var(--text);font-weight:700}
.spark{flex:0 0 auto}
.restnote{
  font-size:12px;color:var(--text2);background:var(--card);border:1px dashed var(--grid);
  border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:8px
}

/* ===== 카카오톡 목업 ===== */
.kakao{background:#b2c7d9;border-radius:16px;padding:13px 12px}
.ktop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ktop b{font-size:12px;color:#2b2b2b;font-weight:700}
.kprof{width:22px;height:22px;border-radius:8px;background:#fee500;flex:0 0 auto}
.kbub{background:#fff;border-radius:4px 15px 15px 15px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.khead{background:var(--critical);color:#fff;padding:10px 14px;font-size:12.5px;font-weight:800}
.kbody{padding:14px}
.kbody .kt{font-size:15.5px;font-weight:800;margin-bottom:10px;line-height:1.45}
.kbody .kp{font-size:13.5px;color:var(--text2);line-height:1.75}
.kbody .kp b{color:var(--text);font-weight:700}
.kbtn{
  display:block;width:100%;margin-top:13px;background:var(--blue);color:#fff;text-align:center;
  padding:13px;border-radius:10px;font-size:13.5px;font-weight:800;min-height:44px
}
.kbtn:active{background:var(--blue-d)}
.ktime{font-size:11.5px;color:#40525f;margin-top:7px;padding-left:2px}

/* ===== 푸시 기록 ===== */
.push{
  background:var(--card);border:1px solid var(--grid);border-radius:14px;
  padding:12px;display:flex;gap:11px;align-items:flex-start;margin-bottom:9px
}
.push.isnew{border-color:var(--critical);background:#fdf6f6}
.pi{width:31px;height:31px;border-radius:9px;background:var(--blue);flex:0 0 auto;position:relative}
.pi::before{content:"";position:absolute;left:7px;top:14.75px;width:17px;height:2.5px;background:#fff;border-radius:2px}
.pi::after{content:"";position:absolute;left:14.25px;top:7px;width:2.5px;height:17px;background:#fff;border-radius:2px}
.push .pt{font-size:14px;font-weight:800}
.push .pb{font-size:13px;color:var(--text2);margin-top:4px;line-height:1.5}
.push .tm{font-size:11.5px;color:var(--muted);margin-left:auto;flex:0 0 auto;padding-left:6px}

/* ===== 진료 차트 ===== */
.patient{
  background:var(--card);border:1px solid var(--grid);border-radius:14px;padding:13px;
  display:flex;gap:13px;align-items:center
}
.patient.s-crit{border-color:var(--critical);border-width:1.5px;background:#fdf6f6;padding:12.5px}
.pav{
  width:50px;height:50px;border-radius:13px;background:var(--blue-100);display:flex;
  align-items:center;justify-content:center;font-size:25px;flex:0 0 auto
}
.patient.s-crit .pav{background:#f8dede}
.patient.s-warn .pav{background:#f6e9cc}
.pn{font-size:17.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.pd{font-size:13.5px;color:var(--text2);margin-top:6px;line-height:1.55}

.card{background:var(--card);border:1px solid var(--grid);border-radius:14px;padding:13px}
.cc-h{font-size:14.5px;font-weight:800}
.cc-s{font-size:12px;color:var(--muted);margin-top:3px;margin-bottom:12px}
.cc-legend{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;padding-top:11px;
  border-top:1px solid var(--grid);font-size:11.5px;color:var(--text2)
}
.cc-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:0}

.dx{border-radius:14px;padding:13px;border:1.5px solid var(--critical);background:#fdf6f6}
.dx.s-good{border-color:var(--good);background:#f4faf4}
.dx.s-warn{border-color:var(--warning-t);background:#fdfaf2}
.dl{font-size:12.5px;font-weight:800;letter-spacing:.4px;color:var(--critical)}
.dx.s-good .dl{color:var(--good)} .dx.s-warn .dl{color:var(--warning-t)}
.dv{font-size:18.5px;font-weight:800;margin-top:7px;letter-spacing:-.4px;line-height:1.4}
.dsub{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:700}
.dp{font-size:13.5px;color:var(--text2);margin-top:8px;line-height:1.6}
.rx{background:var(--blue-100);border-radius:14px;padding:13px}
.rx .dl{color:var(--blue-d)}
.rx .dv{font-size:16.5px;color:var(--blue-d)}

.tl{position:relative;padding-left:17px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:8px;width:1.5px;background:var(--grid)}
.tli{position:relative;padding-bottom:13px}
.tli:last-child{padding-bottom:0}
.tli::before{
  content:"";position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;
  background:var(--surface);border:2.5px solid var(--blue)
}
.tli.crit::before{border-color:var(--critical)}
.tli .d{font-size:12.5px;color:var(--muted);font-weight:700}
.tli .x{font-size:14px;margin-top:4px;line-height:1.5}

.evidence{
  background:var(--card);border:1px solid var(--grid);border-radius:14px;padding:13px;
  font-size:13px;color:var(--text2);line-height:1.7
}
.evidence b{color:var(--text);font-weight:700}
.evidence .src{font-size:11.5px;color:var(--muted);margin-top:8px;padding-top:9px;border-top:1px solid var(--grid)}

/* ===== 설정 ===== */
.set-group{background:var(--card);border:1px solid var(--grid);border-radius:14px;overflow:hidden}
.set-row{padding:14px 13px;border-bottom:1px solid var(--grid)}
.set-row:last-child{border-bottom:0}
.set-row .lab{font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px}
.set-row .hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.inp{
  width:100%;min-width:0;margin-top:9px;padding:11px 12px;border:1px solid var(--grid);border-radius:10px;
  background:var(--surface);font-size:14px;min-height:44px;font-variant-numeric:tabular-nums
}
.inp:focus{outline:2px solid var(--blue);outline-offset:-1px;background:var(--card)}
.times{display:grid;grid-template-columns:1fr auto;gap:9px 8px;align-items:center;margin-top:9px}
.times .inp{margin-top:0;min-width:0}
.times span{font-size:12.5px;color:var(--text2);white-space:nowrap}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin-top:4px
}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--grid)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--grid)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--blue);
  border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);margin-top:-10px
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.28)
}
input[type=range]:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:8px}
.range-val{font-size:14px;font-weight:800;color:var(--blue-d);font-variant-numeric:tabular-nums}
.range-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:-4px}

.sw{position:relative;width:48px;height:29px;flex:0 0 auto}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.sw i{
  position:absolute;inset:0;border-radius:999px;background:#cfcec9;transition:background-color .2s ease;
  pointer-events:none
}
.sw i::after{
  content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s ease
}
.sw input:checked + i{background:var(--blue)}
.sw input:checked + i::after{transform:translateX(19px)}
.sw input:focus-visible + i{outline:2px solid var(--blue);outline-offset:3px}

.demo-box{border:1.5px solid var(--blue);background:#f3f8fe;border-radius:14px;padding:14px}
.demo-box .dh{font-size:13.5px;font-weight:800;color:var(--blue-d)}
.demo-box .dq{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.6}
.btn{
  display:block;width:100%;min-height:52px;border-radius:11px;font-size:15.5px;font-weight:800;
  padding:14px;margin-top:11px;transition:background-color .15s ease,opacity .15s ease
}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:active{background:var(--blue-d)}
.btn-ghost{background:var(--card);color:var(--text2);border:1px solid var(--grid)}
.btn-ghost:active{background:var(--page)}
.btn[disabled]{opacity:.45;pointer-events:none}
.demo-steps{margin-top:12px;font-size:12px;color:var(--text2);line-height:1.9;padding-left:2px}
.demo-steps li{list-style:none;display:flex;gap:8px;align-items:flex-start}
.demo-steps li .k{
  width:17px;height:17px;border-radius:50%;background:var(--grid);color:var(--muted);flex:0 0 auto;
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:5px;
  transition:background-color .3s ease,color .3s ease
}
.demo-steps li.on .k{background:var(--blue);color:#fff}
.demo-steps li.on{color:var(--text);font-weight:600}

.foot{margin-top:20px;font-size:11.5px;color:var(--muted);line-height:1.75;text-align:center}

/* ===== 탭바 ===== */
.tabbar{
  flex:0 0 auto;border-top:1px solid var(--grid);background:var(--card);display:flex;
  padding-bottom:env(safe-area-inset-bottom)
}
.tab{
  flex:1;min-height:58px;padding:8px 0 9px;font-size:11px;font-weight:700;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative
}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--blue)}
.tab .nbadge{
  position:absolute;top:6px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--critical);color:#fff;font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
  border:2px solid var(--card)
}
.tab .nbadge[hidden]{display:none}

/* ===== 푸시 배너 ===== */
.banner{
  position:absolute;top:0;left:0;right:0;z-index:40;padding:10px 12px;
  padding-top:max(10px, env(safe-area-inset-top));
  transform:translateY(-130%);transition:transform .45s cubic-bezier(.2,.9,.3,1.1)
}
.banner.show{transform:translateY(0)}
.banner-in{
  background:rgba(255,255,255,.97);backdrop-filter:blur(6px);
  border:1.5px solid var(--critical);border-radius:16px;padding:12px;
  display:flex;gap:11px;align-items:flex-start;box-shadow:0 8px 26px rgba(0,0,0,.2);
  width:100%;text-align:left
}
.banner .pt{font-size:13.5px;font-weight:800;color:var(--critical)}
.banner .pb{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5}
.banner .tm{font-size:11.5px;color:var(--muted);margin-left:auto;flex:0 0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== 병동 뷰 전환 (목록 / 배치도) ===== */
.seg{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--page);
  border:1px solid var(--grid);border-radius:12px;padding:4px;margin-bottom:14px
}
.seg button{
  min-height:40px;border-radius:9px;font-size:13px;font-weight:700;color:var(--text2);
  display:flex;align-items:center;justify-content:center;gap:6px
}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--blue-d);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 배치도 ===== */
.maprow{margin-bottom:14px}
.maplabel{
  font-size:12px;font-weight:800;color:var(--text2);margin-bottom:7px;
  display:flex;align-items:center;gap:7px
}
.maplabel::after{content:"";flex:1;height:1px;background:var(--grid)}

function untracked(){ return Math.max(0, FARM.total - beds.length); }

/* 날짜 — 'YYYY.MM.DD' 또는 'YYYY-MM-DD' 를 받는다 */
function parseDate(s){
  var p = String(s).replace(/\./g, '-').split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function todayMid(){ var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function growDays(planted){
  return Math.max(0, Math.round((todayMid() - parseDate(planted)) / 86400000));
}
function chartNoOf(planted){
  var p = String(planted).replace(/\./g, '-').split('-');
  return p[0] + '-' + p[1] + p[2];
}
function dotDate(s){ return String(s).replace(/-/g, '.'); }
function dashDate(s){ return String(s).replace(/\./g, '-'); }
function todayLabel(){
  var t = new Date();
  return (t.getMonth() + 1) + '월 ' + t.getDate() + '일';
}
function nowLabel(){
  var t = new Date();
  return '오늘 ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
}

/* --- 조치 완료 처리 --- */
function todayKey(){
  var t = new Date();
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
}
function needsAction(b){ return b.status !== 'good'; }
function isDone(b){ return !!b.doneOn && b.doneOn === todayKey(); }

/* 손봐야 하는데 아직 조치하지 않은 개체 중 가장 급한 것 */
function pendingTop(){
  var list = sortedBeds();
  for(var i=0;i<list.length;i++) if(needsAction(list[i]) && !isDone(list[i])) return list[i];
  return null;
}
function doneCount(){
  var n = 0;
  beds.forEach(function(b){ if(needsAction(b) && isDone(b)) n++; });
  return n;
}

function markDone(bedId){
  var b = bedById(bedId);
  if(!b || isDone(b)) return;
  b.doneOn = todayKey();
  b.log.unshift({ t: nowLabel(), x: '조치 완료 · ' + b.rx });
  $('appbar').innerHTML = APPBAR[current]();
  RENDER[current]();
  announce(b.id + ' 조치를 완료로 기록했습니다.');
}
function undoDone(bedId){
  var b = bedById(bedId);
  if(!b) return;
  b.doneOn = null;
  if(b.log.length && b.log[0].x.indexOf('조치 완료') === 0) b.log.shift();
  $('appbar').innerHTML = APPBAR[current]();
  RENDER[current]();
  announce(b.id + ' 조치 완료를 취소했습니다.');
}

/* 상태에 맞는 보조 문구를 다시 만든다.
   숫자보다 "평소와 견줘 어떤가"를 먼저 읽히게 한다 */
function refreshNote(b){
  if(b.status === 'good'){ b.note = '평소와 비슷합니다'; return; }
  var base = b.baseline > 0 ? b.baseline : 1;
  var n = Math.floor(b.hourly / base);
  b.note = n >= 2 ? '평소보다 ' + n + '배 많습니다' : '평소보다 조금 많습니다';
}

/* 진단명을 쉬운 말로 바꾼다 (전문 용어는 아래에 함께 보여준다) */
var PLAIN_DX = {
  '수분 스트레스 의심'   : '물이 부족한 것 같습니다',
  '초기 수분 스트레스 가능': '물이 조금 부족할 수 있습니다',
  '경미한 신호 증가'     : '신호가 조금 늘었습니다',
  '이상 없음'           : '이상 없습니다'
};
function dxPlain(b){
  return b.dx.plain || PLAIN_DX[b.dx.title] ||
    (b.status === 'crit' ? '이상 신호가 크게 늘었습니다'
     : b.status === 'warn' ? '이상 신호가 늘고 있습니다' : '이상 없습니다');
}

/* 확률을 소수점까지 제시할 근거가 없으므로 3단계 등급으로만 표시한다.
   dx.prob은 등급을 정하는 내부 순서값으로만 쓰고 화면에 숫자로 내보내지 않는다. */
function dxGrade(b){
  if(b.status === 'good') return '이상 신호 없음';
  var p = b.dx.prob;
  return p >= 70 ? '가능성 높음' : p >= 40 ? '가능성 중간' : '가능성 낮음';
}

/* 원논문에서 직접 확인된 작물. 나머지는 잠정 적용이며 화면에 그렇게 밝힌다. */
var VERIFIED_CROPS = ['토마토'];
function isVerifiedCrop(name){ return VERIFIED_CROPS.indexOf(name) >= 0; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function $(id){ return document.getElementById(id); }

function counts(){
  var c = { good:untracked(), warn:0, crit:0 };
  beds.forEach(function(b){ c[b.status]++; });
  return c;
}
function sortedBeds(){
  return beds.slice().sort(function(a,b){
    if(RANK[a.status] !== RANK[b.status]) return RANK[a.status] - RANK[b.status];
    return b.hourly - a.hourly;
  });
}

/* =========================================================
   2. SVG 그리기 (외부 차트 라이브러리 없이 직접 생성)
   ========================================================= */

function sparkPoints(series){
  var W = 56, H = 28, PAD = 3;
  var max = Math.max(threshold, Math.max.apply(null, series), 1);
  var n = series.length;
  var pts = [];
  for(var i=0;i<n;i++){
    var x = PAD + (W - PAD*2) * (i/(n-1));
    var y = (H - PAD) - (H - PAD*2) * (series[i]/max);
    pts.push(x.toFixed(1) + ',' + y.toFixed(1));
  }
  return pts.join(' ');
}

function sparkSVG(bed){
  return '<svg class="spark" width="56" height="28" viewBox="0 0 56 28" aria-hidden="true">' +
    '<polyline data-spark="' + bed.id + '" points="' + sparkPoints(bed.series) + '" fill="none" ' +
    'stroke="' + ST[bed.status].line + '" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function barColor(v){
  if(v >= threshold) return '#d03b3b';
  if(v >= 25) return '#ec835a';
  if(v >= 15) return '#fab219';
  return '#2a78d6';
}

function barChartSVG(series){
  var W = 300, BASE = 112, TOP = 26;
  var maxVal = Math.max.apply(null, series.concat([threshold]));
  var scale  = maxVal * 1.18;
  function y(v){ return BASE - (v/scale) * (BASE - TOP); }

  /* preserveAspectRatio 기본값 유지 — 글자가 가로로 늘어나지 않도록 */
  var s = '<svg viewBox="0 0 300 140" style="display:block;width:100%;height:auto" role="img" ' +
          'aria-label="최근 7일 시간당 초음파 발생 횟수 막대그래프. ' + series.join(', ') + '회.">';

  var ty = y(threshold);
  s += '<text x="2" y="' + (ty - 6).toFixed(1) + '" font-size="11" fill="#d03b3b" font-weight="700">' +
       '위험 기준 ' + threshold + '회</text>';
  s += '<line x1="0" y1="' + ty.toFixed(1) + '" x2="300" y2="' + ty.toFixed(1) +
       '" stroke="#d03b3b" stroke-width="1.4" stroke-dasharray="5 4"/>';
  s += '<line x1="0" y1="' + BASE + '" x2="300" y2="' + BASE + '" stroke="#e5e4e0" stroke-width="1"/>';

  for(var i=0;i<series.length;i++){
    var v = series[i], x = 8 + i*41, top = y(v), h = Math.max(4, BASE - top);
    s += '<rect x="' + x + '" y="' + (BASE-h).toFixed(1) + '" width="26" height="' + h.toFixed(1) +
         '" rx="4" fill="' + barColor(v) + '"/>';
  }

  var last = series[series.length-1];
  s += '<text x="267" y="' + (y(last) - 7).toFixed(1) + '" font-size="12.5" fill="#0b0b0b" ' +
       'text-anchor="middle" font-weight="800">' + last + '</text>';

  var labels = ['6일 전','','4일 전','','2일 전','','오늘'];
  for(var j=0;j<labels.length;j++){
    if(!labels[j]) continue;
    s += '<text x="' + (8 + j*41 + 13) + '" y="129" font-size="11" fill="#8a8985" ' +
         'text-anchor="middle"' + (j===6 ? ' font-weight="700" fill="#52514e"' : '') + '>' + labels[j] + '</text>';
  }
  return s + '</svg>';
}

/* --- 1-B. 배치도 --- */
function rowKey(id){ var m = String(id).match(/^\s*([^\d\-\s]+)/); return m ? m[1].toUpperCase() : '#'; }
function numKey(id){ var m = String(id).match(/(\d+)/);            return m ? +m[1] : 0; }

function mapView(){
  if(!beds.length){
    return '<div class="empty">아직 등록된 개체가 없습니다.<br>아래 버튼으로 첫 개체를 등록해 주세요.</div>';
  }
  var groups = {}, order = [];
  beds.forEach(function(b){
    var k = rowKey(b.id);
    if(!groups[k]){ groups[k] = []; order.push(k); }
    groups[k].push(b);
  });
  order.sort();

  var h = '<h2 class="sec">' + esc(FARM.name) + ' 배치도</h2>';
  order.forEach(function(k){
    var row = groups[k].slice().sort(function(a,b){ return numKey(a.id) - numKey(b.id); });
    h += '<div class="maprow"><div class="maplabel">' + esc(k) + ' 열 · ' + row.length + '개체</div>' +
         '<div class="mapgrid">';
    row.forEach(function(b){
      var st = ST[b.status];
      h += '<button class="cell s-' + b.status + '" type="button" data-bed="' + b.id + '" ' +
        'aria-label="' + b.id + ' ' + b.crop + ', ' + st.label + ', 시간당 ' + b.hourly + '회. 진료 차트 열기">' +
        '<span class="cno">' + b.id + '</span>' +
        '<span class="cemoji" aria-hidden="true">' + b.emoji + '</span>' +
        '<span class="cval">' + b.hourly + '<span class="cunit">회/시간</span></span>' +
        '<span class="badge ' + st.badge + '">' + st.label + '</span>' +
        '</button>';
    });
    h += '</div></div>';
  });

  if(untracked() > 0){
    h += '<div class="restnote" style="margin-bottom:12px">' +
         '<span class="dot" style="background:var(--good)"></span>' +
         '배치도에 없는 ' + untracked() + '개체는 개별 추적 대상이 아니며 모두 <b>정상</b>입니다</div>';
  }
  h += '<div class="legend">' +
    '<span><i style="background:var(--good)"></i>정상</span>' +
    '<span><i style="background:var(--warning)"></i>주의</span>' +
    '<span><i style="background:var(--critical)"></i>위험</span>' +
    '<span style="color:var(--muted)">칸을 누르면 진료 차트가 열립니다</span>' +
    '</div>';
  return h;
}

/* 데모 중 카드 부분 갱신 (전체 리렌더 없이)
   주의: data-bed는 배너·알림 목록에도 붙으므로 반드시 병동 화면 안에서만 찾는다 */
function patchBed(b){
  var st = ST[b.status];
  var ward = $('sc-ward');
  var card = ward.querySelector('[data-bed="' + b.id + '"]');
  if(card && wardView === 'map'){
    card.className = 'cell s-' + b.status;
    card.setAttribute('aria-label', b.id + ' ' + b.crop + ', ' + st.label +
      ', 시간당 ' + b.hourly + '회. 진료 차트 열기');
    var cbadge = card.querySelector('.badge');
    if(cbadge){ cbadge.className = 'badge ' + st.badge; cbadge.textContent = st.label; }
    var cval = card.querySelector('.cval');

  }else if(card){

      ', 최근 1시간 ' + b.hourly + '회. 진료 차트 열기');

/* 화면에 이미 있는 7일 계측값에서만 통계를 뽑는다 (별도 가짜 수치를 만들지 않음) */
function weekStats(){
  var s = { alerts:0, warns:0, quiet:0, daily:[0,0,0,0,0,0,0], peak:[], firstSignal:null };
  beds.forEach(function(b){
    var hadCrit = false, hadWarn = false;
    for(var d=0; d<7; d++){
      var v = b.series[d];
      if(v >= threshold){ s.alerts++; s.daily[d]++; hadCrit = true; }
      else if(v >= threshold/2){ s.warns++; hadWarn = true; }
    }
    if(!hadCrit && !hadWarn) s.quiet++;
    s.peak.push({ id:b.id, crop:b.crop, emoji:b.emoji, status:b.status,
                  max: Math.max.apply(null, b.series) });
  });
  s.quiet += untracked();
  s.peak.sort(function(a,b){ return b.max - a.max; });

  /* 가장 심한 개체의 첫 이상 신호 시점 */
  var top = s.peak.length ? bedById(s.peak[0].id) : null;
  if(top && s.peak[0].max >= threshold/2){
    for(var d=0; d<7; d++){
      if(top.series[d] >= threshold/2){ s.firstSignal = { bed: top, daysAgo: 6 - d }; break; }
    }
  }
  return s;
}

function dayLabel(offset){
  var t = new Date(); t.setDate(t.getDate() + offset);
  return (t.getMonth() + 1) + '월 ' + t.getDate() + '일';
}

function dailyChartSVG(daily){
  var maxVal = Math.max(1, Math.max.apply(null, daily));
  var BASE = 96, TOP = 20;
  function y(v){ return BASE - (v / (maxVal * 1.25)) * (BASE - TOP); }
  var s = '<svg viewBox="0 0 300 122" style="display:block;width:100%;height:auto" role="img" ' +
          'aria-label="일자별 위험 단계 개체 수. ' + daily.join(', ') + '개체.">';
  s += '<line x1="0" y1="' + BASE + '" x2="300" y2="' + BASE + '" stroke="#e5e4e0" stroke-width="1"/>';
  for(var i=0;i<7;i++){
    var v = daily[i], x = 8 + i*41, h = Math.max(3, BASE - y(v));
    s += '<rect x="' + x + '" y="' + (BASE-h).toFixed(1) + '" width="26" height="' + h.toFixed(1) +
         '" rx="4" fill="' + (v > 0 ? '#d03b3b' : '#cde2fb') + '"/>';
    if(v > 0) s += '<text x="' + (x+13) + '" y="' + (BASE-h-6).toFixed(1) + '" font-size="11" ' +
                   'fill="#0b0b0b" text-anchor="middle" font-weight="800">' + v + '</text>';
  }
  var labels = ['6일 전','','4일 전','','2일 전','','오늘'];
  for(var j=0;j<7;j++){
    if(!labels[j]) continue;
    s += '<text x="' + (8 + j*41 + 13) + '" y="112" font-size="11" fill="#8a8985" text-anchor="middle"' +
         (j===6 ? ' font-weight="700" fill="#52514e"' : '') + '>' + labels[j] + '</text>';
  }
  return s + '</svg>';
}

/* --- 4-B. 소리 재현 (Web Audio · 외부 파일 없음) --- */
var audioCtx = null, audioSrc = null, playingKind = null;

function audioOK(){ return !!(window.AudioContext || window.webkitAudioContext); }
function ac(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function rng(seed){
  var s = seed;
  return function(){ s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}
function normalize(d, peak){
  var m = 0;
  for(var i=0;i<d.length;i++) if(Math.abs(d[i]) > m) m = Math.abs(d[i]);
  if(m > 0){ var g = peak / m; for(var j=0;j<d.length;j++) d[j] *= g; }
}

/* 식물 클릭음: 2~4kHz 대역의 짧은 감쇠 버스트를 불규칙 간격으로 */
function plantBuffer(ctx){
  var dur = 3.2, sr = ctx.sampleRate;
  var buf = ctx.createBuffer(1, Math.floor(dur * sr), sr), d = buf.getChannelData(0);
  var r = rng(20260812);
  for(var k=0;k<28;k++){
    var start = Math.floor((0.06 + r() * (dur - 0.25)) * sr);
    var len   = Math.floor((0.004 + r() * 0.006) * sr);
    var f     = 2000 + r() * 2100;
    for(var i=0;i<len;i++){
      if(start + i >= d.length) break;
      var env = Math.exp(-i / (len * 0.26));
      d[start + i] += (Math.sin(2 * Math.PI * f * i / sr) * 0.75 + (r() * 2 - 1) * 0.25) * env;
    }
  }
  normalize(d, 0.9);
  return buf;
}

/* 온실 소음: 저역 럼블 + 전원 험 */
function noiseBuffer(ctx){
  var dur = 3.2, sr = ctx.sampleRate;
  var buf = ctx.createBuffer(1, Math.floor(dur * sr), sr), d = buf.getChannelData(0);
  var r = rng(777), lp = 0;
  for(var i=0;i<d.length;i++){
    lp = lp * 0.988 + (r() * 2 - 1) * 0.012;
    d[i] = lp * 7 +
           Math.sin(2 * Math.PI * 60  * i / sr) * 0.05 +
           Math.sin(2 * Math.PI * 120 * i / sr) * 0.025;
  }
  normalize(d, 0.9);
  return buf;
}

function stopSound(){
  if(audioSrc){ try { audioSrc.onended = null; audioSrc.stop(); } catch(e){} }
  audioSrc = null; playingKind = null;
  syncPlayButtons();
}

function playSound(kind){
  if(!audioOK()) return;
  if(playingKind === kind){ stopSound(); return; }
  stopSound();
  var ctx = ac();
  if(ctx.state === 'suspended') ctx.resume();
  var src = ctx.createBufferSource();
  src.buffer = kind === 'plant' ? plantBuffer(ctx) : noiseBuffer(ctx);
  var g = ctx.createGain();
  g.gain.value = 0.3;
  src.connect(g); g.connect(ctx.destination);
  src.onended = function(){ audioSrc = null; playingKind = null; syncPlayButtons(); };
  src.start();
  audioSrc = src; playingKind = kind;
  syncPlayButtons();
  announce(kind === 'plant' ? '식물 스트레스 재현음을 재생합니다.' : '온실 배경소음 재현음을 재생합니다.');
}

function syncPlayButtons(){
  var btns = document.querySelectorAll('[data-play]');
  for(var i=0;i<btns.length;i++){
    var on = btns[i].getAttribute('data-play') === playingKind;
    btns[i].setAttribute('aria-pressed', String(on));
    btns[i].textContent = on ? '■' : '▶';
    if(!audioOK()){ btns[i].disabled = true; btns[i].textContent = '—'; }
  }
}

var sheetSubmit = null;   // 저장 버튼이 호출할 함수
/* 닫기 애니메이션(260ms) 동안 hidden이 아직 false라, 열림 판정은 별도 플래그로 한다 */
var sheetOpen = false;

function openSheet(title, bodyHTML, saveLabel, onSubmit, danger){
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = bodyHTML;
  var save = $('sheetSave');
  save.textContent = saveLabel;
  save.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
  sheetSubmit = onSubmit;
  sheetOpen = true;
  var sh = $('sheet');
  sh.hidden = false;
  setTimeout(function(){ sh.classList.add('show'); }, 10);
  var first = $('sheetBody').querySelector('input, select, textarea');
  if(first) setTimeout(function(){ first.focus(); }, 260);
}

function closeSheet(){
  var sh = $('sheet');
  sh.classList.remove('show');
  sheetSubmit = null;
  sheetOpen = false;
  setTimeout(function(){ sh.hidden = true; $('sheetBody').innerHTML = ''; }, 260);
}

function showSheetError(msg){
  var e = $('sheetBody').querySelector('.err');
  if(e){ e.textContent = msg; e.hidden = false; }
  $('sheetBody').scrollTop = 0;
}

function field(id, label, inner, hint, required){
  return '<div class="fld"><label for="' + id + '">' + esc(label) +
    (required ? '<span class="req" aria-hidden="true">*</span>' : '') + '</label>' + inner +
    (hint ? '<div class="fhint">' + hint + '</div>' : '') + '</div>';
}

  openSheet(isNew ? '새 개체 등록' : '개체 정보 수정', h, isNew ? '등록하기' : '저장하기',

function saveBed(b){
  var isNew = !b;
  var id = $('in-bedid').value.trim();
  var sel = $('in-crop').value;
  var crop = sel === '__custom' ? $('in-cropx').value.trim() : sel;
  var variety = $('in-variety').value.trim();
  var planted = $('in-planted').value;
  var keeper = $('in-keeper').value.trim();
  var baseline = parseInt($('in-baseline').value, 10);

  if(!id) return showSheetError('베드 번호를 입력해 주세요.');
  var dup = beds.some(function(x){ return x.id === id && x !== b; });
  if(dup) return showSheetError('이미 쓰고 있는 베드 번호입니다: ' + id);
  if(!crop) return showSheetError('작물 이름을 입력해 주세요.');
  if(!planted) return showSheetError('정식일을 선택해 주세요.');
  if(parseDate(planted) > todayMid()) return showSheetError('정식일은 오늘보다 미래일 수 없습니다.');
  if(isNaN(baseline) || baseline < 0 || baseline > 20) return showSheetError('평소 초음파 발생량은 0~20 사이로 입력해 주세요.');

  if(isNew){
    var lo = Math.max(0, baseline - 1);
    var nb = {
      id: id, crop: crop, emoji: cropEmoji(crop), status: 'good',
      hourly: baseline, baseline: baseline,
      series: [baseline, lo, baseline, lo, baseline, lo, baseline],
      variety: variety, planted: dotDate(planted), keeper: keeper, note: '안정',
      dx: { title:'이상 없음', prob: 5,
            desc:'등록 직후입니다. 초음파 기준선을 수집하는 중이며 현재 이상 신호는 없습니다.' },
      rx: '현재 관리 유지',
      log: [{ t: todayLabel(), x: '개체 등록 · 진료 시작' }]
    };
    beds.push(nb);
    FARM.total = Math.max(FARM.total + 1, beds.length);
    selected = id;
    announce(id + ' 베드에 ' + crop + '을(를) 등록했습니다.');
  }else{
    var oldId = b.id;
    b.id = id; b.crop = crop; b.emoji = cropEmoji(crop);
    b.variety = variety; b.planted = dotDate(planted); b.keeper = keeper;
    b.baseline = baseline;
    refreshNote(b);
    if(oldId !== id){
      if(selected === oldId) selected = id;
      if(kakaoBedId === oldId) kakaoBedId = id;
      pushLog.forEach(function(p){ if(p.bed === oldId) p.bed = id; });
    }
    announce(id + ' 베드 정보를 수정했습니다.');
  }

  closeSheet();
  RENDER[current]();
  $('appbar').innerHTML = APPBAR[current]();
}

/* 퇴원 처리 */
function openDeleteSheet(bedId){
  var b = bedById(bedId);
  if(!b) return;
  var h = '<div class="err" hidden></div>' +
    '<p class="confirm-msg"><b>' + esc(b.id) + ' 베드 ' + esc(b.crop) + '</b>을(를) 목록에서 지웁니다.<br>' +
    '진료 기록과 계측 이력도 함께 사라지며, 되돌릴 수 없습니다.</p>' +
    '<p class="confirm-msg">전체 개체 수는 ' + FARM.total + '개체에서 ' +
    Math.max(beds.length - 1, FARM.total - 1) + '개체로 줄어듭니다.</p>';
  openSheet('퇴원 처리', h, '퇴원 처리하기', function(){ return deleteBed(bedId); }, true);
}

function deleteBed(bedId){
  var i = beds.findIndex(function(x){ return x.id === bedId; });
  if(i < 0) return closeSheet();
  var gone = beds[i];
  beds.splice(i, 1);
  FARM.total = Math.max(beds.length, FARM.total - 1);
  pushLog = pushLog.filter(function(p){ return p.bed !== bedId; });
  if(selected === bedId) selected = beds.length ? beds[0].id : null;
  if(kakaoBedId === bedId) kakaoBedId = beds.length ? sortedBeds()[0].id : null;

  closeSheet();
  announce(gone.id + ' 베드 ' + gone.crop + '을(를) 퇴원 처리했습니다.');
  go('ward');
}

var RENDER = { ward:renderWard, alert:renderAlert, chart:renderChart, report:renderReport, set:renderSet };
var TABS = ['ward','alert','chart','report','set'];

function go(tab){
  if(tab !== 'report') stopSound();
  current = tab;
  TABS.forEach(function(t){
    $('sc-' + t).hidden = (t !== tab);
    var btn = $('tab-' + t);
    btn.setAttribute('aria-selected', String(t === tab));
  });
  $('appbar').innerHTML = APPBAR[tab]();
  RENDER[tab]();
  $('screens').scrollTop = 0;
  if(tab === 'alert') setUnread(0);
}

function openChart(bedId){
  selected = bedId;
  hideBanner();
  go('chart');
  announce(bedId + ' 베드 진료 차트를 열었습니다.');
}

function setUnread(n){
  unread = n;
  var el = $('navBadge');
  el.textContent = n;
  el.hidden = (n <= 0);
}

function announce(msg){ $('live').textContent = msg; }

/* =========================================================
   5. 푸시 배너
   ========================================================= */

function showBanner(title, body, bedId){
  $('bannerT').textContent = title;
  $('bannerB').textContent = body;
  $('bannerBtn').setAttribute('data-bed', bedId || '');
  $('banner').classList.add('show');
  timers.push(setTimeout(hideBanner, 6500));
}
function hideBanner(){ $('banner').classList.remove('show'); }

/* =========================================================
   6. 시연 모드
   ========================================================= */

/* 시연 대상은 실행 시점에 정상 개체 중에서 고른다 (개체가 바뀌어도 동작하도록) */
var demoBedId = null, DEMO_BASE = null, DEMO_TARGET = null, demoSnapshot = null;

function pickDemoBed(){
  var list = sortedBeds();
  for(var i=0;i<list.length;i++) if(list[i].status === 'good') return list[i];
  return null;
}
function demoMsg(text){
  var el = $('demoMsg');
  if(el){ el.textContent = text || ''; el.hidden = !text; }
}

function tween(dur, onStep, onDone){
  var start = null;
  function frame(now){
    if(start === null) start = now;
    var p = Math.min(1, (now - start) / dur);
    onStep(1 - Math.pow(1 - p, 3));
    if(p < 1){ rafId = requestAnimationFrame(frame); }
    else { rafId = null; if(onDone) onDone(); }
  }
  rafId = requestAnimationFrame(frame);
}

function applyDemoProgress(p){
  var b = bedById(demoBedId);
  if(!b) return;
  var s = [];
  for(var i=0;i<DEMO_BASE.length;i++){
    s.push(Math.round(DEMO_BASE[i] + (DEMO_TARGET[i] - DEMO_BASE[i]) * p));
  }
  b.series = s;
  b.hourly = s[s.length-1];
  if(current === 'ward') patchBed(b);
}

function runDemo(){
  if(demoOn) return;

  var b = pickDemoBed();
  if(!b){
    demoMsg('시연하려면 정상 상태인 개체가 최소 하나 필요합니다. 개체를 등록하거나 초기화 후 다시 시도해 주세요.');
    announce('시연할 정상 개체가 없습니다.');
    return;
  }
  demoMsg('');

  /* 시연 직전 상태를 저장해 두고, 초기화 때 여기로만 되돌린다
     (사용자가 등록·수정한 개체가 지워지지 않도록) */
  demoSnapshot = { beds: clone(beds), pushLog: clone(pushLog),
                   kakaoBedId: kakaoBedId, selected: selected, farm: clone(FARM) };

  demoBedId = b.id;
  var peak = Math.max(threshold + 5, Math.round(threshold * 1.27));
  DEMO_BASE = b.series.slice();
  DEMO_TARGET = [DEMO_BASE[0], DEMO_BASE[1], DEMO_BASE[2],
                 Math.round(peak * 0.11), Math.round(peak * 0.24), Math.round(peak * 0.55), peak];

  demoOn = true; demoStep = 0;
  syncDemoButtons();
  go('ward');
  announce('시연을 시작합니다. ' + b.id + ' ' + b.crop + '의 신호가 올라갑니다.');

  /* 1단계 (0 ~ 1.1초) — 정상 → 주의 */
  demoStep = 2; syncDemoButtons();
  tween(1100, function(p){
    applyDemoProgress(p * 0.45);
    var bb = bedById(demoBedId);
    if(bb && bb.hourly >= threshold/2 && bb.status === 'good'){
      bb.status = 'warn'; refreshNote(bb);
      demoStep = 1; syncDemoButtons();
      if(current === 'ward'){ patchBed(bb); }
    }
  }, function(){

    /* 2단계 (1.3 ~ 2.4초) — 주의 → 위험 */
    timers.push(setTimeout(function(){
      tween(1100, function(p){
        applyDemoProgress(0.45 + p * 0.55);
        var bb = bedById(demoBedId);
        if(!bb) return;
        if(bb.hourly >= threshold) bb.status = 'crit';
        refreshNote(bb);
        if(current === 'ward') patchBed(bb);
      }, finishDemo);
    }, 200));
  });
}

function finishDemo(){
  var bb = bedById(demoBedId);
  if(!bb){ demoOn = false; syncDemoButtons(); return; }

  bb.status = 'crit';
  bb.hourly = DEMO_TARGET[DEMO_TARGET.length-1];
  bb.series = DEMO_TARGET.slice();
  refreshNote(bb);
  bb.dx = { title:'수분 스트레스 의심', prob:79,
            desc:'6시간 전부터 급격히 증가했습니다. 육안 증상은 2~3일 뒤 나타날 것으로 예상됩니다.' };
  bb.rx = '즉시 관수 밸브 · 배지 함수율 점검';
  bb.log.unshift({ t:'방금', x:'위험 단계 진입 (' + bb.hourly + '회/시간)', crit:true });

  if(current === 'ward'){ patchBed(bb); renderWard(); }

  /* 3단계 — 푸시 배너 */
  timers.push(setTimeout(function(){
    demoStep = 3; syncDemoButtons();
    showBanner(bb.id + ' 위험 단계 진입',
               bb.crop + ' · 초음파 ' + bb.hourly + '회/시간 감지', bb.id);

    /* 4단계 — 알림 뱃지 + 기록 추가 */
    timers.push(setTimeout(function(){
      demoStep = 4; syncDemoButtons();
      pushLog.unshift({ t: bb.id + ' 위험 단계 진입',
                        b:'초음파 ' + bb.hourly + '회/시간 감지 · 평소 ' + bb.baseline + '회',
                        tm:'방금', bed: bb.id, isnew:true });
      kakaoBedId = bb.id;
      setUnread(unread + 1);
      if(current === 'alert') renderAlert();
      demoOn = false; syncDemoButtons();
      announce(bb.id + ' ' + bb.crop + '이(가) 위험 단계에 진입했습니다. 알림이 발송되었습니다.');
    }, 260));
  }, 180));
}

function resetAll(){
  if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  timers.forEach(clearTimeout); timers = [];
  demoOn = false; demoStep = 0;
  hideBanner();
  setUnread(0);

  if(!demoSnapshot){
    syncDemoButtons();
    demoMsg('되돌릴 시연 기록이 없습니다.');
    announce('되돌릴 시연 기록이 없습니다.');
    return;
  }

  beds       = clone(demoSnapshot.beds);
  pushLog    = clone(demoSnapshot.pushLog);
  kakaoBedId = demoSnapshot.kakaoBedId;
  selected   = demoSnapshot.selected;
  FARM       = clone(demoSnapshot.farm);
  demoSnapshot = null;
  demoBedId = null;

  $('appbar').innerHTML = APPBAR[current]();
  RENDER[current]();
  syncDemoButtons();
  demoMsg('');
  announce('시연 전 상태로 되돌렸습니다.');
}

/* =========================================================
   7. 이벤트 (위임)
   ========================================================= */

document.addEventListener('click', function(e){
  /* 시트가 열려 있을 때는 시트 조작만 받는다 */
  if(e.target.closest('[data-sheet-close]')){ closeSheet(); return; }
  if(e.target.closest('#sheetSave')){ if(sheetSubmit) sheetSubmit(); return; }
  if(sheetOpen && !e.target.closest('.sheet-panel')) return;

  var doneBtn = e.target.closest('[data-done]');
  if(doneBtn){ markDone(doneBtn.getAttribute('data-done')); return; }

  var undoBtn = e.target.closest('[data-undo]');
  if(undoBtn){ undoDone(undoBtn.getAttribute('data-undo')); return; }

  var playBtn = e.target.closest('[data-play]');
  if(playBtn){ playSound(playBtn.getAttribute('data-play')); return; }

  var viewBtn = e.target.closest('[data-ward-view]');
  if(viewBtn){
    wardView = viewBtn.getAttribute('data-ward-view');
    renderWard();
    announce(wardView === 'map' ? '배치도 보기로 바꿨습니다.' : '목록 보기로 바꿨습니다.');
    return;
  }

  if(e.target.closest('[data-add-bed]')){ openBedSheet(null); return; }

  var editBtn = e.target.closest('[data-edit-bed]');
  if(editBtn){ openBedSheet(editBtn.getAttribute('data-edit-bed')); return; }

  var delBtn = e.target.closest('[data-del-bed]');
  if(delBtn){ openDeleteSheet(delBtn.getAttribute('data-del-bed')); return; }

  var tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ go(tabBtn.getAttribute('data-tab')); return; }

  var gotoBtn = e.target.closest('[data-goto]');
  if(gotoBtn){ go(gotoBtn.getAttribute('data-goto')); return; }

  var bedBtn = e.target.closest('[data-bed]');
  if(bedBtn){
    var id = bedBtn.getAttribute('data-bed');
    if(id) openChart(id);
    return;
  }
});

/* 시트: Esc 닫기, Enter 저장 */
document.addEventListener('keydown', function(e){
  if(!sheetOpen) return;
  if(e.key === 'Escape'){ e.preventDefault(); closeSheet(); }
  else if(e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'date'){
    e.preventDefault();
    if(sheetSubmit) sheetSubmit();
  }
});

/* 탭바 좌우 방향키 이동 */
document.querySelector('.tabbar').addEventListener('keydown', function(e){
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var i = tabs.indexOf(document.activeElement);
  if(i < 0) return;
  e.preventDefault();
  var next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
  next.focus();
  go(next.getAttribute('data-tab'));
});

/* =========================================================
   8. 시작
   ========================================================= */
beds.forEach(refreshNote);   // 예시 데이터의 보조 문구를 현재 표현으로 통일
go('ward');

})();
</script>
